<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Reminders</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold fs-3"
           href="/">

            <i class="fa-solid fa-bell me-2"></i>

            Auto Care

        </a>

        <div>

            <a href="/"
               class="btn btn-outline-light me-2">

                Home

            </a>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>

            <a href="/reminders"
               class="btn btn-outline-light me-2">

                Reminders

            </a>

            <a href="/notifications"
               class="btn btn-outline-light">

                Notifications

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow-lg rounded-4 p-5">

        <h2 class="text-primary text-center">
            Reminder List
        </h2>

        <hr>

        <form action="/search"
              method="get"
              class="d-flex mb-3">

            <input type="text"
                   name="keyword"
                   class="form-control me-2"
                   placeholder="Search reminders...">

            <button type="submit"
                    class="btn btn-primary">

                Search

            </button>

        </form>

        <a href="/addReminder"
           class="btn btn-success mb-3">

            Add Reminder

        </a>

        <table class="table table-hover table-striped shadow-lg">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="reminder : ${reminders}">

                <td th:text="${reminder.reminderId}"></td>

                <td th:text="${reminder.title}"></td>

                <td th:text="${reminder.dueDate}"></td>

                <td>

                    <span th:if="${#strings.equalsIgnoreCase(reminder.currentStatus, 'Pending')}"
                          class="badge bg-warning text-dark">

                        Pending

                    </span>

                    <span th:if="${#strings.equalsIgnoreCase(reminder.currentStatus, 'Completed')}"
                          class="badge bg-success">

                        Completed

                    </span>

                    <span th:if="${#strings.equalsIgnoreCase(reminder.currentStatus, 'OVERDUE')}"
                          class="badge bg-danger">

                        OVERDUE

                    </span>

                </td>

                <td>

                    <a th:href="@{/completeReminder/{id}(id=${reminder.reminderId})}"
                       class="btn btn-success btn-sm">

                        Complete

                    </a>

                    <a th:href="@{/editReminder/{id}(id=${reminder.reminderId})}"
                       class="btn btn-primary btn-sm">

                        Edit

                    </a>

                    <a th:href="@{/deleteReminder/{id}(id=${reminder.reminderId})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this reminder?')">

                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <a href="/"
           class="btn btn-secondary">

            Home

        </a>

    </div>

</div>

<footer class="bg-dark text-white text-center p-4 mt-5">

    <h5 class="fw-bold">

        Car Service & Maintenance Tracker

    </h5>

    <p class="mb-0">

        © 2026 SLIIT OOP Project

    </p>

</footer>

</body>
</html>
