<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Notifications</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold fs-3"
           href="/">

            <i class="fa-solid fa-bell me-2"></i>

            Auto Care

        </a>

        <div>

            <a href="/"
               class="btn btn-outline-light me-2">

                Home

            </a>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>

            <a href="/reminders"
               class="btn btn-outline-light me-2">

                Reminders

            </a>

            <a href="/notifications"
               class="btn btn-outline-light">

                Notifications

            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="card shadow p-5">

        <h2 class="text-warning text-center">
            Notifications
        </h2>

        <hr>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Message</th>
                <th>Date</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="notification : ${notifications}">

                <td th:text="${notification.notificationId}"></td>

                <td th:text="${notification.message}"></td>

                <td th:text="${notification.date}"></td>

            </tr>

            </tbody>

        </table>

        <a href="/"
           class="btn btn-secondary">

            Home

        </a>

    </div>

</div>

<footer class="bg-dark text-white text-center p-4 mt-5">

    <h5 class="fw-bold">

        Car Service & Maintenance Tracker

    </h5>

    <p class="mb-0">

        © 2026 SLIIT OOP Project

    </p>

</footer>

</body>
</html>
