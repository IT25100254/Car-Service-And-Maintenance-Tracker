<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

<h1 class="mb-4">
    Vehicle Dashboard
</h1>

<div class="row">

    <div class="col-md-4"
         th:each="vehicle : ${vehicles}">

        <div class="card mb-3 shadow">

            <div class="card-body">

                <h4 th:text="${vehicle.model}"></h4>

                <p>
                    Vehicle Number:
                    <span th:text="${vehicle.vehicleNumber}"></span>
                </p>

                <p>
                    Fuel Economy:
                    <span th:text="${vehicle.fuelEconomy}"></span>
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
