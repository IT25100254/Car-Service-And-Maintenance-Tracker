<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoCare Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .bg-image {
            background-image: url('assets/images/car_service_bg.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex text-slate-800">

    <!-- Left side - Image -->
    <div class="hidden lg:flex lg:w-1/2 bg-image relative">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/30 to-transparent"></div>
        <div class="absolute bottom-12 left-12 right-12 text-white">
            <div class="inline-flex items-center justify-center p-2 rounded-xl bg-white/20 backdrop-blur-md mb-6 border border-white/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <h2 class="text-4xl font-bold mb-4 tracking-tight leading-tight">Professional Care<br>For Your Vehicle</h2>
            <p class="text-lg text-slate-200 max-w-md">Track services, schedule maintenance, and ensure your vehicle is always in top condition with AutoCare Tracker.</p>
        </div>
    </div>

    <!-- Right side - Login Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 bg-white">
        <div class="w-full max-w-md">
            <div class="mb-10 text-left">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome Back</h1>
                <p class="text-slate-500">Please enter your details to sign in.</p>
            </div>

            <div id="errorMsg" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm font-medium"></div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username or Email</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username"
                        class="w-full px-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white transition-all duration-200">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white transition-all duration-200">
                </div>

                <div class="flex items-center justify-between pt-2 pb-4">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900 cursor-pointer">
                        <label for="remember-me" class="ml-2.5 block text-sm text-slate-600 cursor-pointer">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a href="forgot-password.html" class="font-medium text-slate-900 hover:text-blue-600 transition-colors">Forgot password?</a>
                    </div>
                </div>

                <button type="submit"
                    class="w-full flex justify-center py-4 px-4 rounded-xl shadow-lg shadow-slate-200/50 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all duration-300 transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </form>

            <div class="mt-10 text-center text-sm text-slate-500">
                Don't have an account?
                <a href="register.html" class="font-semibold text-slate-900 hover:text-blue-600 transition-colors ml-1">Sign up here</a>
            </div>
        </div>
    </div>

    <script>
        // Hardcoded admin credentials
        const ADMIN_USERS = [
            { id: '1', fullname: 'System Admin', username: 'admin', email: 'admin@autocare.com', password: 'admin123', role: 'ADMIN' }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            // Check admin first
            const adminMatch = ADMIN_USERS.find(a =>
                (a.username === usernameInput || a.email === usernameInput) && a.password === passwordInput
            );
            if (adminMatch) {
                localStorage.setItem('currentUser', JSON.stringify({ ...adminMatch }));
                window.location.href = 'admin.html';
                return;
            }

            // Check customers from localStorage
            const customers = JSON.parse(localStorage.getItem('customers') || '[]');
            const customerMatch = customers.find(c =>
                (c.username === usernameInput || c.email === usernameInput) && c.password === passwordInput
            );
            if (customerMatch) {
                localStorage.setItem('currentUser', JSON.stringify({ ...customerMatch, role: 'CUSTOMER' }));
                window.location.href = 'index.html';
                return;
            }

            errorMsg.textContent = 'Invalid username or password. Please try again.';
            errorMsg.classList.remove('hidden');
        });
    </script>
</body>
</html>
